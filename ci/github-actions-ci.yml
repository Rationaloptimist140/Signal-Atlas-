name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal
          POSTGRES_PASSWORD: signal
          POSTGRES_DB: signal_atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signal" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests alembic
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL and Redis)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://signal:signal@localhost:5432/signal_atlas_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL and match the models
        env:
          DATABASE_URL: postgresql://signal:signal@localhost:5432/signal_atlas_test
          APP_ENV: test
        run: |
          PGPASSWORD=signal psql -h localhost -U signal -d signal_atlas_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
